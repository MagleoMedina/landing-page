services:
  - type: web
    name: landing-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/contact/status
    envVars:
      - key: PORT
        value: 8080
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Portfolio <onboarding@resend.dev>
      - key: CONTACT_TO
        sync: false