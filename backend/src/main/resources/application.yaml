server:
  port: ${PORT:8080}

spring:
  application:
    name: landing
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  contact:
    to: ${CONTACT_TO:}
    from: ${CONTACT_FROM:${MAIL_USERNAME:}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}